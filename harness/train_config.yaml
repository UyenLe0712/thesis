# train_config.yaml — LLaMA-Factory · Qwen2.5-VL-3B QLoRA
# Viết lại 5/8/2026 cho thiết kế đã khoá ở report/106. Bản cũ theo khung Faithful
# Distillation (Student / Student-RAW) đã bỏ.
#
# MỘT FILE DÙNG CHO MỌI NHÁNH — chỉ đổi ba dòng, không đổi gì khác. Đó là điều
# kiện để chênh lệch điểm quy được về can thiệp:
#     dataset      gui_s1 · gui_s2 · gui_s2r · gui_s2_nopoint
#     seed         101 (hạt giống 1) · 202 (hạt giống 2) · 303 (chỉ khi cổng ở
#                  report/106 mục 2 kích hoạt)
#     output_dir   .../<nhánh>_seed<seed>
#
# Trình tự bắt buộc (report/106 mục 5): chạy đủ s1 hai hạt giống, chấm, đo MDE
# thật, khoá ngưỡng — RỒI MỚI chạy s2. Không đảo.
#
# Máy: vast.ai A100-80GB (bf16). Nếu rơi xuống card Turing đời cũ không có bf16
# thì đổi bf16→false, fp16→true và ghi lại vào mục sửa đổi của report/106, vì
# đổi độ chính xác số học giữa các nhánh là làm hỏng phép so.

model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true
image_min_pixels: 200704          # 256 * 28^2
image_max_pixels: 1003520         # 1280 * 28^2 — hạ xuống 602112 nếu thiếu bộ nhớ

### ── nhánh: BA DÒNG DUY NHẤT ĐƯỢC PHÉP ĐỔI ───────────────────────────────────
dataset: gui_s1
seed: 101
output_dir: /workspace/ckpt/s1_seed101
dataset_dir: /workspace/data/branches   # nơi đặt dataset_info.json + 4 tệp nhánh
### ───────────────────────────────────────────────────────────────────────────

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
freeze_vision_tower: true         # hành vi cần dạy là "nói gì", không phải "nhìn thấy gì"
freeze_multi_modal_projector: true
quantization_bit: 4               # QLoRA 4-bit NF4
quantization_method: bnb

template: qwen2_vl                # dùng chung Qwen2-VL và Qwen2.5-VL
cutoff_len: 2048                  # đủ cho ảnh + mục tiêu + ~24 dòng OCR + đích
train_on_prompt: false            # chỉ tính mất mát trên lượt trợ lý

per_device_train_batch_size: 4    # A100-80GB gánh được; hạ về 1 nếu card nhỏ
gradient_accumulation_steps: 4    # cỡ lô hiệu dụng = 16, giữ nguyên cho mọi nhánh
learning_rate: 1.0e-4
num_train_epochs: 2.0             # 2 lượt duyệt, khoá trong report/106
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
fp16: false
gradient_checkpointing: true

save_steps: 200                   # máy thuê loại rẻ có thể bị ngắt giữa chừng
save_total_limit: 2
# KHÔNG khai resume_from_checkpoint. Đây là bẫy ngược: LLaMA-Factory chỉ tự dò
# checkpoint gần nhất trong output_dir KHI trường này còn bỏ trống
# (hparams/parser.py — điều kiện `resume_from_checkpoint is None`). Điền bất cứ
# giá trị nào, kể cả "auto", sẽ tắt đúng cái nó định bật, rồi ném thẳng chuỗi đó
# cho Trainer như một đường dẫn thư mục và làm hỏng lượt chạy lại. Bỏ trống =
# tự động chạy tiếp. Cũng vì vậy không được bật overwrite_output_dir.
logging_steps: 20
report_to: none

# Tập kiểm chia theo ỨNG DỤNG, không phải chia ngẫu nhiên theo dòng: màn hình cùng
# một app na ná nhau nên chia ngẫu nhiên sẽ rò rỉ và cho điểm ảo. Việc chia làm
# ở khâu dựng dữ liệu; ở đây tắt hẳn phần tự chia của LLaMA-Factory.
val_size: 0.0
do_eval: false
