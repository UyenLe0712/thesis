# train_config.yaml — LLaMA-Factory, Qwen2.5-VL-3B QLoRA (report/53 §3).
# Freeze vision (chi LoRA decoder) — hanh vi can do la "noi gi khi khong chac", khong phai "nhin thay gi".
# Train HAI ban voi cung file nay, chi doi `dataset` + `output_dir`:
#   - Student     : dataset=faithful_gui_train      (data DA LOC, buoc 2.6)
#   - Student-RAW : dataset=faithful_gui_train_raw   (data BASE tho, cung train_apps)
# Chay tren Colab (✱ GPU) — KHONG chay tren may nay (khong GPU).

model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
image_min_pixels: 200704          # 256 * 28^2
image_max_pixels: 1003520         # 1280 * 28^2 (ha xuong 602112 = 768*28^2 neu T4 OOM)
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
freeze_vision_tower: true
freeze_multi_modal_projector: true
quantization_bit: 4               # QLoRA 4-bit NF4 (MAC DINH, chay duoc ca T4 16GB)
quantization_method: bnb

dataset: faithful_gui_train       # <-- doi thanh faithful_gui_train_raw cho ban Student-RAW
template: qwen2_vl                # dung chung Qwen2-VL va Qwen2.5-VL
cutoff_len: 2048
train_on_prompt: false            # chi tinh loss tren luot assistant

output_dir: /content/drive/MyDrive/thesis_ckpt/qwen25vl3b_faithful_lora
save_steps: 50                    # ~10-15 phut wall-clock -> luu thuong xuyen (chong ngat phien Colab)
save_total_limit: 3
resume_from_checkpoint: auto

per_device_train_batch_size: 1
gradient_accumulation_steps: 16   # doi 8 neu chac chan L4/A100
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: false                       # true neu GPU = L4/A100 (re nhanh tu dong dau notebook theo device_name)
fp16: true                        # T4 (Turing) khong co bf16 tensor-core
gradient_checkpointing: true

val_size: held_out_by_app         # split thu cong theo APP, KHONG dung val_size random-row mac dinh
eval_strategy: epoch
